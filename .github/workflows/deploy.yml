name: Taller1

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.IP_PUBLICA }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: ".dockerignore,Dockerfile,app.py,compose.yaml,profile.json,requirements.txt,static,templates"
          target: "/home/${{ secrets.USERNAME }}/proyecto1"
          overwrite: true

      - name: Levantar contenedor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_PUBLICA }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd ~/proyecto1
            docker compose down
            docker compose up -d --build
            docker compose ps